name: CI

# push 只保留 main(消除分支 push + PR 双触发, 被取消的重复 run
# 曾在 PR 检查里显示为 fail); 分支/PR 一律走 pull_request 事件。
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# push+PR 双触发的同 SHA 去重 —— 按 head SHA 分组(push 与
# pull_request 事件对同一 commit 共组, 后到的取消先到的), 被取代的旧 run
# 一并取消
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Comment vocabulary lint (new lines only)
        # 词表检查: 新增行禁止编号代号与决策过程用语(存量已清理, 不追溯)
        run: |
          # 浅克隆没有 main 的远端引用与共同祖先: 显式建出 origin/main 并补全历史
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags --quiet --unshallow origin || true
          python scripts/check_comment_vocabulary.py --base origin/main

      - name: Run pure unit tests
        env:
          # 明显 CI synthetic value — 不指向任何真实库, 也不得连接
          HGS_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/unused
        run: |
          python -m unittest \
            tests.test_gate \
            tests.test_db_gate \
            tests.test_security \
            tests.test_worker \
            tests.test_whole_record \
            tests.test_locale_payload_cb \
            tests.test_cb_mol \
            tests.test_caslib \
            tests.test_api_contract_governance \
            tests.test_oauth_contract \
            tests.test_mcp_oauth_contract \
            tests.test_notes_ui_contract \
            tests.test_openai_plugin_readiness

      # worker 启动路径的无条件 import（含函数级 aiohttp_socks）必须在
      # 干净 venv（只装 requirements-worker.txt）里可解析 —— 否则生产装完依赖
      # 启动必崩。AST 级检查抓函数体内的 import，纯 import worker.main 抓不到。
      - name: Worker clean-venv import check (B5-06)
        run: |
          python -m venv /tmp/worker-venv
          /tmp/worker-venv/bin/pip install --quiet --disable-pip-version-check -r requirements-worker.txt
          /tmp/worker-venv/bin/python scripts/check_worker_imports.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Type-check frontend
        working-directory: web
        run: npx tsc --noEmit

      - name: Web unit tests (node:test, strip-types)
        # /此前 7 个 *.test.mjs 只有 5 个进 CI(govSeverity 与
        # 反应 SVG 路由测试无执行入口) —— 全量进 CI。
        working-directory: web
        run: npm run test:unit

      - name: API layer static checks
        # 取数层分界: "use client" 不得引服务端取数模块(读请求作用域头);
        # 服务端文件不得用客户端取数函数(不带访客身份直连后端)。
        working-directory: web
        run: npm run check:api-layer

      - name: Locale runtime behavior tests (tsx, real TS SUT)
        # 门禁: locale redirect/rewrite proxy 契约(malformed cookie)、
        # withLocale/applyLocale 登录回跳、NON_LOCALIZED_PREFIXES 边界、
        # 语言切换器、runtime 字典、canonical/hreflang/x-default 全部进 CI。
        # tsx --test 直接加载真实 .ts 实现, 无镜像、无临时编译协议。
        working-directory: web
        run: npm run test:locale

      - name: Admin pagination pure-function tests (tsc+node)
        # 真测 web/lib/adminPagination.ts: tsc 编译 + node 执行产物。
        # 必须在 npm ci 之后 (需要 web/node_modules/.bin/tsc)。
        # integration job 无 web deps → 同一测试在那里明确 skip, 见 skipUnless。
        run: python -m unittest tests.test_admin_pagination_ui -v

      - name: Build frontend
        working-directory: web
        run: npm run build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 16 + RDKit cartridge
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-rdkit

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql@16-main
          pg_isready -h 127.0.0.1 -p 5432 -t 30

      - name: Create disposable CI superuser and database
        run: |
          # disposable hosted-runner PostgreSQL; hgs_ci 需要 superuser
          # 因为 baseline 要 CREATE EXTENSION (rdkit/pg_trgm/tsm_system_rows)
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE hgs_ci LOGIN SUPERUSER PASSWORD 'ci-password';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE test_hgs OWNER hgs_ci;"

      - name: Bootstrap baseline schema
        env:
          PGPASSWORD: ci-password
        run: |
          psql -h 127.0.0.1 -U hgs_ci -d test_hgs \
            -v ON_ERROR_STOP=1 -f migrations/0000_baseline.sql
          psql -h 127.0.0.1 -U hgs_ci -d test_hgs \
            -v ON_ERROR_STOP=1 -f migrations/0001_bootstrap_reference_data.sql

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forward migration runner
        # 正式迁移契约: bootstrap 后 forward migrations 必须经 runner。
        # fresh baseline 已有 reconciliation 目标表 → runner 记录 no-op tracking。
        run: |
          python scripts/migrate.py "postgresql://hgs_ci:ci-password@127.0.0.1:5432/test_hgs"

      - name: Run full test suite
        env:
          HGS_DATABASE_URL: postgresql+asyncpg://hgs_ci:ci-password@127.0.0.1:5432/test_hgs
          TEST_DATABASE_URL: postgresql+asyncpg://hgs_ci:ci-password@127.0.0.1:5432/test_hgs?test_sentinel=hgs-test-db
          HGS_REDIS_URL: redis://127.0.0.1:6379/15
          HGS_SKILL_ROOT: ${{ runner.temp }}/hgs-skills
        run: |
          python -m unittest discover -s tests
