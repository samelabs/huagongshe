name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pure unit tests
        env:
          # 明显 CI synthetic value — 不指向任何真实库, 也不得连接
          HGS_DATABASE_URL: postgresql+asyncpg://ci:ci@127.0.0.1:5432/unused
        run: |
          python -m unittest \
            tests.test_gate \
            tests.test_db_gate \
            tests.test_security \
            tests.test_worker \
            tests.test_locale_payload_cb \
            tests.test_cb_mol \
            tests.test_caslib \
            tests.test_api_contract_governance \
            tests.test_oauth_contract \
            tests.test_mcp_oauth_contract \
            tests.test_plugin_submission_contract

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Type-check frontend
        working-directory: web
        run: npx tsc --noEmit

      - name: Locale runtime behavior tests (tsx, real TS SUT)
        # v1.6.0 门禁: locale redirect/rewrite proxy 契约(malformed cookie)、
        # withLocale/applyLocale 登录回跳、NON_LOCALIZED_PREFIXES 边界、
        # 语言切换器、runtime 字典、canonical/hreflang/x-default 全部进 CI。
        # tsx --test 直接加载真实 .ts 实现, 无镜像、无临时编译协议。
        working-directory: web
        run: npm run test:locale

      - name: Admin pagination pure-function tests (tsc+node)
        # 真测 web/lib/adminPagination.ts: tsc 编译 + node 执行产物。
        # 必须在 npm ci 之后 (需要 web/node_modules/.bin/tsc)。
        # integration job 无 web deps → 同一测试在那里明确 skip, 见 skipUnless。
        run: python -m unittest tests.test_admin_pagination_ui -v

      - name: Build frontend
        working-directory: web
        run: npm run build

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL 16 + RDKit cartridge
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-16-rdkit

      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql@16-main
          pg_isready -h 127.0.0.1 -p 5432 -t 30

      - name: Create disposable CI superuser and database
        run: |
          # disposable hosted-runner PostgreSQL; hgs_ci 需要 superuser
          # 因为 baseline 要 CREATE EXTENSION (rdkit/pg_trgm/tsm_system_rows)
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c \
            "CREATE ROLE hgs_ci LOGIN SUPERUSER PASSWORD 'ci-password';"
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c \
            "CREATE DATABASE test_hgs OWNER hgs_ci;"

      - name: Bootstrap baseline schema
        env:
          PGPASSWORD: ci-password
        run: |
          psql -h 127.0.0.1 -U hgs_ci -d test_hgs \
            -v ON_ERROR_STOP=1 -f migrations/0000_baseline.sql
          psql -h 127.0.0.1 -U hgs_ci -d test_hgs \
            -v ON_ERROR_STOP=1 -f migrations/0001_bootstrap_reference_data.sql

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forward migration runner
        # 正式迁移契约: bootstrap 后 forward migrations 必须经 runner。
        # fresh baseline 已有 reconciliation 目标表 → runner 记录 no-op tracking。
        run: |
          python scripts/migrate.py "postgresql://hgs_ci:ci-password@127.0.0.1:5432/test_hgs"

      - name: Run full test suite
        env:
          HGS_DATABASE_URL: postgresql+asyncpg://hgs_ci:ci-password@127.0.0.1:5432/test_hgs
          TEST_DATABASE_URL: postgresql+asyncpg://hgs_ci:ci-password@127.0.0.1:5432/test_hgs?test_sentinel=hgs-test-db
          HGS_REDIS_URL: redis://127.0.0.1:6379/15
          HGS_SKILL_ROOT: ${{ runner.temp }}/hgs-skills
        run: |
          python -m unittest discover -s tests
