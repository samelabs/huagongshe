upstream hgs_api { server 127.0.0.1:8000; }
upstream hgs_web { server 127.0.0.1:3001; }

# 访问日志: combined 格式之后追加请求耗时、上游耗时、Cloudflare Ray ID 与访客国家。
log_format hgs_main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time urt=$upstream_response_time '
                    'cf_ray=$http_cf_ray cc=$http_cf_ipcountry';

limit_req_zone $binary_remote_addr zone=hgs_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hgs_data_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name huagongshe.com www.huagongshe.com;
    return 301 https://huagongshe.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.huagongshe.com;

    ssl_certificate /etc/letsencrypt/live/huagongshe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huagongshe.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    return 301 https://huagongshe.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name huagongshe.com;

    ssl_certificate /etc/letsencrypt/live/huagongshe.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/huagongshe.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/snippets/cloudflare-realip.conf;

    charset utf-8;
    charset_types application/json text/xml application/xml;
    # Block scrapers
    if ($http_user_agent ~* "(aiohttp|AhrefsBot|SERanking|Lightpanda|MJ12bot)") { return 403; }

    client_max_body_size 6M;
    access_log /var/log/nginx/huagongshe_access.log hgs_main;
    error_log /var/log/nginx/huagongshe_error.log;

    location /uploads/avatars/ {
        root /var/lib/huagongshe;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # MCP 面(M1): Streamable HTTP 直透 FastAPI(绕 Next BFF — 其 header 白名单
    # 无 mcp-session-id 且 arrayBuffer 缓冲断 SSE 流). SSE: 关代理缓冲, 长读超时.
    # 2026-08-31 终局: MCP 端点 = /mcp(规范路径锁死, 直透 FastAPI)。
    # SSE: 关代理缓冲+长读超时。0915: 旧 /api/mcp 兜底块剥离(7天日志零真实流量)。
    location = /mcp {
        limit_req zone=hgs_api burst=40 nodelay;
        proxy_pass http://hgs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
    # 对外数据服务(/data/v1)直接转发给 FastAPI;
    # 该接口自带凭证鉴权(HMAC 签名 + nonce 防重放)与按凭证计量。
    # limit_req 补齐"无效凭证刷鉴权"的边界: 鉴权失败不占凭证额度, 应用侧
    # 另有 per-IP 失败桶, nginx 层先挡量级洪水。
    # $binary_remote_addr 经 cloudflare-realip 后即真实访客 IP。
    location /data/ {
        limit_req zone=hgs_data_api burst=20 nodelay;
        proxy_pass http://hgs_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }

    location /api/ {
        limit_req zone=hgs_api burst=40 nodelay;
        proxy_pass http://hgs_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 35s;
        proxy_send_timeout 35s;
    }


    location / {
        proxy_pass http://hgs_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
