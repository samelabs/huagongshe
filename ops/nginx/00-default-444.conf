# Default catch-all: reject bare-IP / unconfigured-hostname requests
# instead of falling through to the first vhost (cas.cool).
# Port 80 answers 444: nginx closes the connection without a response.
# Port 443 refuses the TLS handshake, so no vhost's certificate is presented.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}
