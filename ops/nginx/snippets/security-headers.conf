# ── Security headers ──────────────────────────────────────────
# Force HTTPS for 1 year (incl. subdomains). Site is HTTPS-only.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
# Prevent clickjacking.
add_header X-Frame-Options "DENY" always;
# Stop MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;
# Limit referrer leakage to origin-only on cross-origin requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Lock down browser APIs (camera, mic, geolocation, etc.).
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
# Content-Security-Policy — restrict script/style/img sources
# add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://sdk.51.la https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self' https://*.51.la; frame-ancestors 'none'" always;
